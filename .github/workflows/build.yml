name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ARGuard_project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle assembleRelease --no-daemon
        working-directory: ARGuard
      - uses: actions/upload-artifact@v4
        with:
          name: AR-Guard-apk
          path: ARGuard/app/build/outputs/apk/release/*.apk
